[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depot-hedging-strategist"
version = "1.2.0"
description = "Depot Hedging Strategist"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "pandas>=2.0.0",
    "yfinance>=1.7.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.2.3"
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# Pyflakes and the pycodestyle error rules. Listed explicitly because the default
# rule set changes between ruff releases, which would break CI on version bumps.
select = ["E4", "E7", "E9", "F"]
